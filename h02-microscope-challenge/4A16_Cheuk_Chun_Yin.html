<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顯微鏡操作規範排序遊戲</title>
  <!-- 載入輕量級紙屑動畫庫 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 12px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* 表單樣式 */
    .form-group {
      width: 100%;
      max-width: 360px;
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* 頂部數據列 */
    .dashboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .stat-box {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-weight: bold;
      color: var(--primary);
      font-size: 1.1rem;
    }

    /* 排序清單 */
    .sortable-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .step-card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      transition: all 0.2s ease;
    }

    .step-card.dragging {
      opacity: 0.5;
      background-color: rgba(56, 189, 248, 0.2);
    }

    .step-content {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
    }

    .step-num {
      background-color: var(--primary);
      color: #000;
      font-weight: bold;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .step-text h4 {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .step-text p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .step-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-left: 8px;
    }

    .action-btn {
      background: var(--card-border);
      color: var(--text-main);
      border: none;
      border-radius: 4px;
      width: 28px;
      height: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 證書樣式 */
    .certificate {
      background: #ffffff;
      color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      border: 8px double #0284c7;
      width: 100%;
      margin: 15px 0;
      text-align: center;
    }

    .certificate h2 {
      font-size: 1.6rem;
      color: #0284c7;
      margin-bottom: 15px;
    }

    .cert-info {
      font-size: 1.1rem;
      margin: 10px 0;
    }

    .meme-box {
      margin-top: 15px;
      padding: 12px;
      background: #f8fafc;
      border: 2px dashed #f59e0b;
      border-radius: 8px;
    }

    .meme-title {
      font-weight: bold;
      color: #d97706;
      font-size: 1.1rem;
    }

    .student-identity {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 50;
      margin: 0;
      padding: 10px 16px;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      background: #ffffff;
      color: #111827;
      border: 1px solid rgba(17, 24, 39, 0.16);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", "WenQuanYi Micro Hei", sans-serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      white-space: nowrap;
      pointer-events: none;
      user-select: text;
    }

    body:not(:has(#login-screen.active)) .student-identity {
      display: none;
    }

    @media (max-width: 480px), (max-height: 640px) {
      .student-identity {
        right: 10px;
        bottom: 10px;
        padding: 8px 12px;
        font-size: 13px;
      }
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #certificate-area, #certificate-area * {
        visibility: visible;
      }
      #certificate-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <p class="student-identity">卓晉賢 (Cheuk Chun Yin)4A16</p>

  <div class="container">
    <!-- 模組一：學生登入 -->
    <div id="login-screen" class="screen active">
      <h1>🔬 顯微鏡操作規範排序遊戲</h1>
      <p class="subtitle">請輸入你的個人資料開始挑戰！</p>
      
      <div class="form-group">
        <label>姓名：</label>
        <input type="text" id="student-name" placeholder="例如：張小明">
      </div>
      <div class="form-group">
        <label>班別：</label>
        <input type="text" id="student-class" placeholder="例如：1A">
      </div>
      <div class="form-group">
        <label>學號/班號：</label>
        <input type="text" id="student-no" placeholder="例如：05">
      </div>

      <button class="btn" onclick="startChallenge()">開始挑戰</button>
    </div>

    <!-- 模組二：互動排序與計時 -->
    <div id="game-screen" class="screen">
      <div class="dashboard">
        <div class="stat-box">時間：<span id="timer" class="stat-value">00:00</span></div>
        <div class="stat-box">嘗試次數：<span id="attempts" class="stat-value">0</span></div>
      </div>

      <div id="sortable-list" class="sortable-list"></div>

      <button class="btn" onclick="checkOrder()">提交答案</button>
    </div>

    <!-- 模組四：證書與 Meme 結算 -->
    <div id="end-screen" class="screen">
      <div id="certificate-area" class="certificate">
        <h2>📜 顯微鏡操作規範合格證書</h2>
        <p class="cert-info">茲證明 <strong><span id="cert-class"></span> (<span id="cert-no"></span>) <span id="cert-name"></span></strong> 同學</p>
        <p class="cert-info">已成功完成光學顯微鏡標準 8 步驟操作排序挑戰！</p>
        <hr style="margin: 15px 0;">
        <p><strong>最終得分：</strong><span id="cert-score" style="color:#0284c7; font-weight:bold;"></span> 分</p>
        <p><strong>完成時間：</strong><span id="cert-time"></span></p>
        
        <div class="meme-box">
          <div id="meme-title" class="meme-title"></div>
          <div id="meme-desc" style="font-size:0.95rem; margin-top:4px;"></div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn" onclick="window.print()">列印 / 下載證書</button>
        <button class="btn" onclick="location.reload()" style="background: var(--card-border);">再試一次</button>
      </div>
    </div>
  </div>

  <script>
    const stepsData = [
      { id: 1, title: "取鏡安放", desc: "右手握臂、左手托座，將顯微鏡平穩置於桌面偏左處。" },
      { id: 2, title: "對光調亮", desc: "轉至低倍物鏡並調整光源，使視野呈現明亮白色光圈。" },
      { id: 3, title: "固定玻片", desc: "將標本放上載物台夾緊，並將觀察目標正對通光孔中心。" },
      { id: 4, title: "側視靠近", desc: "從側面注視，轉動粗調節器使載物台升至最高（玻片貼近物鏡）。" },
      { id: 5, title: "遠離尋像", desc: "看著目鏡並轉動粗調節器使載物台逐漸下降尋找物像，再轉細調節器調至清晰。" },
      { id: 6, title: "目標居中", desc: "移動玻片，將欲放大觀察的部位移至視野正中央。" },
      { id: 7, title: "高倍微調", desc: "轉至高倍物鏡並加大光圈，僅使用細調節器微調至清晰。" },
      { id: 8, title: "復原歸位", desc: "取下玻片，將物鏡轉至兩側八字形，載物台降至最低後收納。" }
    ];

    let currentSteps = [];
    let timerInterval = null;
    let secondsElapsed = 0;
    let attempts = 0;
    let studentInfo = {};

    function startChallenge() {
      const name = document.getElementById('student-name').value.trim();
      const cls = document.getElementById('student-class').value.trim();
      const no = document.getElementById('student-no').value.trim();

      if (!name || !cls || !no) {
        alert('請填妥所有個人資料！');
        return;
      }

      studentInfo = { name, cls, no };

      // 切換畫面
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('game-screen').classList.add('active');

      // 打亂步驟
      currentSteps = [...stepsData].sort(() => Math.random() - 0.5);
      renderList();

      // 啟動計時
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function renderList() {
      const listEl = document.getElementById('sortable-list');
      listEl.innerHTML = '';

      currentSteps.forEach((step, index) => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.draggable = true;
        card.dataset.index = index;

        card.innerHTML = `
          <div class="step-content">
            <div class="step-num">${index + 1}</div>
            <div class="step-text">
              <h4>${step.title}</h4>
              <p>${step.desc}</p>
            </div>
          </div>
          <div class="step-actions">
            <button class="action-btn" onclick="moveStep(${index}, -1)">▲</button>
            <button class="action-btn" onclick="moveStep(${index}, 1)">▼</button>
          </div>
        `;

        // 拖曳事件
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('drop', handleDrop);
        card.addEventListener('dragend', handleDragEnd);

        listEl.appendChild(card);
      });
    }

    function moveStep(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= currentSteps.length) return;
      const temp = currentSteps[index];
      currentSteps[index] = currentSteps[newIndex];
      currentSteps[newIndex] = temp;
      renderList();
    }

    let dragSrcIndex = null;
    function handleDragStart(e) {
      dragSrcIndex = this.dataset.index;
      this.classList.add('dragging');
    }
    function handleDragOver(e) { e.preventDefault(); }
    function handleDrop(e) {
      e.preventDefault();
      const targetIndex = this.dataset.index;
      if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
        const movedItem = currentSteps.splice(dragSrcIndex, 1)[0];
        currentSteps.splice(targetIndex, 0, movedItem);
        renderList();
      }
    }
    function handleDragEnd() { this.classList.remove('dragging'); }

    function checkOrder() {
      attempts++;
      document.getElementById('attempts').innerText = attempts;

      const isCorrect = currentSteps.every((step, i) => step.id === i + 1);

      if (isCorrect) {
        clearInterval(timerInterval);
        showCertificate();
      } else {
        alert('順序有誤，請再仔細檢查一下！');
      }
    }

    function showCertificate() {
      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('end-screen').classList.add('active');

      // 計分機制：基礎100分，每次錯誤扣10分，一次過全對額外加20分
      let score = 100 - (attempts - 1) * 10;
      if (attempts === 1) score += 20;
      score = Math.max(0, score);

      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');

      document.getElementById('cert-name').innerText = studentInfo.name;
      document.getElementById('cert-class').innerText = studentInfo.cls;
      document.getElementById('cert-no').innerText = studentInfo.no;
      document.getElementById('cert-score').innerText = score;
      document.getElementById('cert-time').innerText = `${mins} 分 ${secs} 秒`;

      // 香港 Meme 評級
      let memeTitle = "", memeDesc = "";
      if (attempts === 1) {
        memeTitle = "🏆 係愛呀哈利！一次過完美通關！";
        memeDesc = "連伽利略都佩服你嘅顯微鏡操作技巧！";
      } else if (attempts <= 3) {
        memeTitle = "🔥 This is a very good try!";
        memeDesc = "雖然有試過錯，但依然好快搵出正確順序！";
      } else {
        memeTitle = "😅 唔要緊，最緊要開心！";
        memeDesc = "失敗乃成功之母，理論係可以被修正嘅！";
      }

      document.getElementById('meme-title').innerText = memeTitle;
      document.getElementById('meme-desc').innerText = memeDesc;

      // 噴紙屑祝賀
      if (typeof confetti === 'function') {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }
  </script>
</body>
</html>
