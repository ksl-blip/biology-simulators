<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>M24 聚合酶鏈反應（PCR） · HKDSE 生物</title>
<style>

:root {
  --paper: #f3eee4;
  --ink: #2b241c;
  --muted: #5a493c;
  --green: #1f6b3a;
  --green-d: #174e2b;
  --card: #fffaf3;
  --line: #e0d2c0;
  --hl: #fff3c4;
  --red: #b42318;
  --blue: #1d4ed8;
  --purple: #7c3aed;
  --amber: #d97706;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "PingFang HK", "Noto Sans CJK HK", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  line-height: 1.55;
  font-size: 16px;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: clamp(22px, 3.2vw, 28px); line-height: 1.3; margin: 0 0 6px; }
h2 { font-size: 18px; margin: 0 0 10px; }
p { margin: 6px 0; }
.kicker { letter-spacing: .08em; color: var(--muted); margin: 0 0 4px; font-size: 13px; font-weight: 700; }
.banner {
  background: #fff6e4;
  border: 1px solid #e4c98a;
  border-radius: 14px;
  padding: 10px 14px;
  margin: 10px 0 14px;
  font-size: 14px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  margin: 0;
}
.muted { color: var(--muted); }
.small { font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.act {
  background: var(--green); color: #fff; border: 0; border-radius: 999px;
  padding: 10px 16px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700;
}
button.ghost {
  background: transparent; color: var(--green-d); border: 1px solid var(--green);
  border-radius: 999px; padding: 10px 16px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700;
}
button:disabled { opacity: .42; cursor: not-allowed; }
button:focus-visible { outline: 3px solid #1f6b3a; outline-offset: 2px; }
.step-tag {
  display: inline-block; padding: 4px 10px; border-radius: 999px;
  background: #efe4d2; font-size: 13px; font-weight: 700;
}
.slider-line { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; }
input[type="range"] { width: min(420px, 70vw); accent-color: #1f6b3a; }
.day-big { font-variant-numeric: tabular-nums; font-weight: 800; min-width: 6.5em; font-size: 17px; }
.grid-main {
  display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 14px; margin-top: 14px;
}
.panel-title { font-size: 14px; font-weight: 800; margin: 0 0 8px; color: var(--muted); letter-spacing: .04em; }
.stage {
  background: linear-gradient(#f7f1e6, #efe2d0 72%, #e6d4bb);
  border: 1px solid var(--line); border-radius: 16px; padding: 10px; min-height: 320px;
  position: relative; overflow: hidden;
}
.stage svg { width: 100%; height: auto; display: block; }
.caption {
  margin-top: 10px; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px; font-size: 14px; min-height: 3.4em;
}
.caption strong.key { color: var(--red); }
.flow { max-height: 620px; overflow: auto; padding-right: 4px; }
.flow-phase {
  font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--muted);
  margin: 12px 0 6px; padding-bottom: 2px; border-bottom: 1px dashed var(--line);
}
.flow-phase:first-child { margin-top: 0; }
.step {
  display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start;
  padding: 7px 8px; border-radius: 10px; border: 1px solid transparent; margin: 3px 0;
  transition: background .2s, border-color .2s; cursor: pointer;
}
.step .n {
  width: 24px; height: 24px; border-radius: 999px; background: #efe4d2;
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--muted);
}
.step.active { background: var(--hl); border-color: #e4c98a; box-shadow: 0 0 0 1px #f0d58a inset; }
.step.active .n { background: var(--green); color: #fff; }
.step.done .n { background: #86efac; color: #14532d; }
.step .txt strong.key, .step.key .txt { color: inherit; }
.step .txt .key { color: var(--red); font-weight: 800; }
.status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.stat {
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
}
.stat .lab { font-size: 12px; color: var(--muted); }
.stat .val { font-weight: 800; font-size: 15px; }
footer {
  margin-top: 18px; color: var(--muted); font-size: 13px;
  border-top: 1px solid var(--line); padding-top: 12px;
}
.back { color: var(--green-d); font-weight: 700; text-decoration: none; font-size: 14px; }
.back:hover { text-decoration: underline; }
@media (max-width: 900px) {
  .grid-main, .status { grid-template-columns: 1fr; }
  .flow { max-height: none; }
}
@media (prefers-reduced-motion: reduce) {
  .step { transition: none; }
}


</style>
</head>
<body>
<div class="wrap">
  <p><a class="back" href="index.html">← 返回實驗室</a></p>
  <p class="kicker">HKDSE · 中四至中六 · M24</p>
  <h1>聚合酶鏈反應（PCR）</h1>
  <p class="muted small">變性（95°C）→ 退火（55–60°C）→ 延伸（70°C），循環後約得 2ⁿ 複本。</p>
  <div class="banner">題目：繪一流程圖以顯示聚合酶鏈反應。留意三個溫度與引物、DNA 聚合酶的角色。</div>

  <div class="card">
    <div class="controls">
      <button type="button" class="act" id="btnPlay" aria-pressed="false">播放</button>
      <button type="button" class="ghost" id="btnPrev">上一步</button>
      <button type="button" class="ghost" id="btnNext">下一步</button>
      <button type="button" class="ghost" id="btnReset">重設</button>
      <span class="step-tag" id="stepTag">步驟 1</span>
    </div>
    <div class="slider-line">
      <label for="stepSlider" class="small muted">步驟</label>
      <input type="range" id="stepSlider" min="0" max="10" step="1" value="0" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
      <span class="day-big" id="stepLabel">步驟 1</span>
    </div>
    <div class="status">
      <div class="stat"><div class="lab">階段</div><div class="val" id="statA">—</div></div>
      <div class="stat"><div class="lab">溫度</div><div class="val" id="statB">—</div></div>
      <div class="stat"><div class="lab">產物</div><div class="val" id="statC">—</div></div>
    </div>
  </div>

  <div class="grid-main">
    <div>
      <div class="card">
        <p class="panel-title">互動場景</p>
        <div class="stage" id="stage">
          <svg id="scene" viewBox="0 0 560 340" role="img" aria-label="聚合酶鏈反應（PCR）示意"></svg>
        </div>
        <div class="caption" id="caption"></div>
      </div>
    </div>
    <div class="card flow" aria-label="流程圖">
      <h2>流程圖 · 跟住步驟走</h2>
      <p class="small muted" style="margin-top:-4px">現時步驟會反黃。紅色為教師卡關鍵句。<br>題目：繪一流程圖以顯示聚合酶鏈反應。</p>
      <div id="flowSteps"></div>
    </div>
  </div>

  <footer>
    模擬教學模型 · 用來顯示過程次序與概念，不是實驗協議或臨床數據。<br>
    詞彙：變性、退火、延伸、引物、DNA 聚合酶、核苷酸、模板、2ⁿ 複本、PCR。
  </footer>
</div>

<script>
(function () {
  "use strict";
  var STEPS = [
  {phase:"概述", tag:"聚合酶鏈反應", flow:"標題：<span class='key'>聚合酶鏈反應</span>（PCR）", caption:"<strong class='key'>聚合酶鏈反應（PCR）</strong>可在體外快速大量複製特定 DNA 片段。", statA:"PCR", statB:"體外擴增", statC:"循環開始"},
  {phase:"變性", tag:"變性", flow:"<span class='key'>變性</span>", caption:"進入<strong class='key'>變性</strong>階段：高溫使雙鏈 DNA 分開。", statA:"變性", statB:"95°C", statC:"雙鏈→單鏈"},
  {phase:"變性", tag:"加熱 95°C", flow:"DNA <span class='key'>加熱（95°C）</span>", caption:"把 DNA <strong class='key'>加熱至約 95°C</strong>，破壞鹼基對之間的氫鍵。", statA:"95°C", statB:"氫鍵斷開", statC:"變性中"},
  {phase:"變性", tag:"雙鏈→單鏈", flow:"雙鏈斷開 → <span class='key'>單鏈</span>", caption:"雙鏈 DNA 分開成兩條<strong class='key'>單鏈</strong>，作為複製模板。", statA:"單鏈模板", statB:"2 條模板", statC:"準備退火"},
  {phase:"退火", tag:"退火", flow:"<span class='key'>退火</span>", caption:"進入<strong class='key'>退火</strong>階段：溫度下降，引物結合到單鏈。", statA:"退火", statB:"55–60°C", statC:"引物結合"},
  {phase:"退火", tag:"降溫 55–60°C", flow:"<span class='key'>降溫（55–60°C）</span>", caption:"溫度降至約 <strong class='key'>55–60°C</strong>，適合引物與模板配對。", statA:"55–60°C", statB:"降溫", statC:"配對條件"},
  {phase:"退火", tag:"加入引物", flow:"加入<span class='key'>引物</span>（小段 DNA）", caption:"加入短的<strong class='key'>引物</strong>（小段單鏈 DNA），標示擴增起點。", statA:"引物", statB:"小段 DNA", statC:"已加入"},
  {phase:"退火", tag:"引物結合", flow:"<span class='key'>引物</span>與模板結合", caption:"引物根據鹼基配對原則，結合到單鏈模板的特定位置。", statA:"引物－模板", statB:"鹼基配對", statC:"起點就緒"},
  {phase:"延伸", tag:"擴增 DNA", flow:"<span class='key'>擴增 DNA</span>", caption:"開始<strong class='key'>擴增</strong>：在引物之後合成新的互補鏈。", statA:"延伸準備", statB:"70°C", statC:"合成中"},
  {phase:"延伸", tag:"延伸", flow:"<span class='key'>延伸</span>", caption:"進入<strong class='key'>延伸</strong>階段：DNA 聚合酶延長新鏈。", statA:"延伸", statB:"聚合酶", statC:"鏈延長"},
  {phase:"延伸", tag:"加熱 70°C", flow:"<span class='key'>加熱（70°C）</span>", caption:"溫度調至約 <strong class='key'>70°C</strong>（耐熱 DNA 聚合酶的最適溫度）。", statA:"70°C", statB:"最適溫", statC:"延伸中"},
  {phase:"延伸", tag:"DNA 聚合酶", flow:"<span class='key'>DNA 聚合酶</span>催化", caption:"<strong class='key'>DNA 聚合酶</strong>（如 Taq）以單鏈為模板，把核苷酸接上。", statA:"Taq 酶", statB:"催化合成", statC:"5'→3'"},
  {phase:"延伸", tag:"核苷酸鍵合", flow:"相鄰<span class='key'>核苷酸鍵合</span>", caption:"相鄰<strong class='key'>核苷酸</strong>以磷酸二酯鍵連接，形成新的 DNA 鏈。", statA:"磷酸二酯鍵", statB:"核苷酸", statC:"新鏈形成"},
  {phase:"延伸", tag:"形成相同 DNA", flow:"形成<span class='key'>相同 DNA</span>", caption:"一個循環結束，原來的 DNA 片段被複製，形成<strong class='key'>相同序列</strong>的新 DNA。", statA:"1 循環完成", statB:"拷貝×2", statC:"相同序列"},
  {phase:"循環", tag:"不斷重複", flow:"<span class='key'>不斷重複</span>變性→退火→延伸", caption:"重複變性、退火、延伸多個循環，拷貝數<strong class='key'>指數增長</strong>。", statA:"多循環", statB:"重複 1–14", statC:"指數增"},
  {phase:"結果", tag:"2ⁿ 複本", flow:"產生 <span class='key'>2ⁿ</span> 複本", caption:"經過 n 個循環後，理論上可產生約 <strong class='key'>2ⁿ</strong> 份目標 DNA 複本。", statA:"2ⁿ 複本", statB:"大量 DNA", statC:"擴增完成"}
];

  function drawScene(i) {

    var svg = $("scene");
    var temp = "—";
    var phase = "";
    if (i >= 1 && i <= 3) { temp = "95°C"; phase = "變性"; }
    else if (i >= 4 && i <= 7) { temp = "55–60°C"; phase = "退火"; }
    else if (i >= 8 && i <= 13) { temp = "70°C"; phase = "延伸"; }
    else if (i >= 14) { temp = "循環中"; phase = "重複"; }
    else { temp = "室溫"; phase = "開始"; }

    // DNA strands
    var y1 = 120, y2 = 160;
    var sep = (i >= 1 && i <= 3) ? 40 : ((i >= 4) ? 50 : 10);
    var strand = function(y, color, dash) {
      return '<path d="M80 '+y+' Q160 '+(y-15)+' 240 '+y+' T400 '+y+' T520 '+y+'" fill="none" stroke="'+color+'" stroke-width="4" stroke-linecap="round" '+(dash||'')+'/>';
    };
    var top = strand(y1 - (sep/2), "#2563eb");
    var bot = strand(y2 + (sep/2), "#db2777");
    var primers = "";
    if (i >= 6) {
      primers = '<path d="M140 '+(y2+sep/2)+' h50" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>'
        + '<path d="M360 '+(y1-sep/2)+' h50" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>'
        + '<text x="165" y="'+(y2+sep/2+22)+'" text-anchor="middle" font-size="11" fill="#92400e">引物</text>'
        + '<text x="385" y="'+(y1-sep/2-10)+'" text-anchor="middle" font-size="11" fill="#92400e">引物</text>';
    }
    var poly = "";
    if (i >= 11) {
      poly = '<rect x="200" y="'+(y2+sep/2-18)+'" width="36" height="20" rx="4" fill="#7c3aed"/>'
        + '<text x="218" y="'+(y2+sep/2-4)+'" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Pol</text>';
    }
    var newChain = "";
    if (i >= 12) {
      newChain = '<path d="M190 '+(y2+sep/2)+' h120" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>'
        + '<path d="M360 '+(y1-sep/2)+' h-100" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>';
    }
    // copy growth bars for late steps
    var copies = 1;
    if (i >= 13) copies = 2;
    if (i >= 14) copies = 8;
    if (i >= 15) copies = 32;
    var bars = "";
    if (i >= 13) {
      for (var k = 0; k < Math.min(copies, 16); k++) {
        bars += '<rect x="'+(40+k*30)+'" y="280" width="18" height="28" rx="3" fill="#34d399" stroke="#065f46"/>';
      }
      bars += '<text x="280" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#14532d">複本數 ≈ '+copies+(i>=15?' （2ⁿ）':'')+'</text>';
    }
    var thermo = '<rect x="430" y="30" width="100" height="70" rx="12" fill="#fff" stroke="#c4b5a0" stroke-width="2"/>'
      + '<text x="480" y="55" text-anchor="middle" font-size="12" fill="#5a493c">'+phase+'</text>'
      + '<text x="480" y="80" text-anchor="middle" font-size="18" font-weight="900" fill="#b42318">'+temp+'</text>';

    svg.innerHTML = thermo + top + bot + primers + poly + newChain + bars
      + '<text x="280" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">DNA 模板</text>';

  }


  function $(id) { return document.getElementById(id); }
  var playing = false;
  var timer = null;
  var step = 0;
  var playBtn = $("btnPlay");
  var nextBtn = $("btnNext");
  var prevBtn = $("btnPrev");
  var resetBtn = $("btnReset");
  var slider = $("stepSlider");
  var stepLabel = $("stepLabel");
  var stepTag = $("stepTag");
  var flowEl = $("flowSteps");
  var captionEl = $("caption");

  function stopPlay() {
    playing = false;
    if (timer) { clearInterval(timer); timer = null; }
    playBtn.textContent = "播放";
    playBtn.setAttribute("aria-pressed", "false");
  }

  function renderFlow() {
    flowEl.innerHTML = "";
    var lastPhase = null;
    STEPS.forEach(function (s, i) {
      if (s.phase && s.phase !== lastPhase) {
        lastPhase = s.phase;
        var ph = document.createElement("div");
        ph.className = "flow-phase";
        ph.textContent = s.phase;
        flowEl.appendChild(ph);
      }
      var d = document.createElement("div");
      d.className = "step" + (i === step ? " active" : "") + (i < step ? " done" : "");
      d.setAttribute("role", "button");
      d.setAttribute("tabindex", "0");
      d.dataset.i = String(i);
      d.innerHTML = '<span class="n">' + (i + 1) + '</span><div class="txt">' + s.flow + '</div>';
      d.addEventListener("click", function () { stopPlay(); setStep(i); });
      d.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); stopPlay(); setStep(i); }
      });
      flowEl.appendChild(d);
    });
  }

  function setStep(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    slider.value = String(step);
    slider.setAttribute("aria-valuenow", String(step));
    stepLabel.textContent = "步驟 " + (step + 1) + " / " + STEPS.length;
    stepTag.textContent = STEPS[step].tag || ("步驟 " + (step + 1));
    captionEl.innerHTML = STEPS[step].caption;
    $("statA").textContent = STEPS[step].statA || "—";
    $("statB").textContent = STEPS[step].statB || "—";
    $("statC").textContent = STEPS[step].statC || "—";
    renderFlow();
    drawScene(step);
    prevBtn.disabled = step === 0;
    nextBtn.disabled = step === STEPS.length - 1;
  }

  playBtn.addEventListener("click", function () {
    if (playing) { stopPlay(); return; }
    if (step >= STEPS.length - 1) setStep(0);
    playing = true;
    playBtn.textContent = "暫停";
    playBtn.setAttribute("aria-pressed", "true");
    timer = setInterval(function () {
      if (step >= STEPS.length - 1) { stopPlay(); return; }
      setStep(step + 1);
    }, 1600);
  });
  nextBtn.addEventListener("click", function () { stopPlay(); setStep(step + 1); });
  prevBtn.addEventListener("click", function () { stopPlay(); setStep(step - 1); });
  resetBtn.addEventListener("click", function () { stopPlay(); setStep(0); });
  slider.addEventListener("input", function () { stopPlay(); setStep(parseInt(slider.value, 10) || 0); });

  slider.max = String(STEPS.length - 1);
  slider.setAttribute("aria-valuemax", String(STEPS.length - 1));
  setStep(0);

})();
</script>
</body>
</html>
